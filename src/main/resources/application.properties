spring.application.name=sabor-gourmet

# Puerto de la API: http://localhost:8080
server.port=8080

# Ruta del archivo JSON donde se guardan clientes, mesas y reservas.
# Es relativa a la carpeta desde donde se ejecuta la aplicacion (la raiz del proyecto).
app.archivo-json=data/datos.json

# Nunca mostrar trazas internas (stack traces) en las respuestas de error.
server.error.include-stacktrace=never
server.error.include-message=never
